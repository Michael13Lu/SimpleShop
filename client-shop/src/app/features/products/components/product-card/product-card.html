<article class="product-card">
  <h3 class="product-card__name">{{ product().name }}</h3>

  @if (product().description) {
    <p class="product-card__description">{{ product().description }}</p>
  }

  <div class="product-card__meta">
    <span class="product-card__price">{{ product().price | number: '1.2-2' }} $</span>
    @if (outOfStock) {
      <span class="product-card__stock product-card__stock--out">Out of stock</span>
    } @else {
      <span class="product-card__stock">In stock: {{ product().stockQuantity }}</span>
    }
  </div>

  <div class="product-card__actions">
    <a class="product-card__details-btn" [routerLink]="['/products', product().id]">View Details</a>
    <button
      class="product-card__cart-btn"
      type="button"
      [disabled]="outOfStock"
      (click)="addToCart()"
    >
      Add to Cart
    </button>
  </div>
</article>
